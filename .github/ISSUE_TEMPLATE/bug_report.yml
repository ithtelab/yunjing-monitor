name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include passwords, tokens, databases, backups, or unredacted logs. Report vulnerabilities privately through the Security tab.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.4.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Admin panel
        - Server
        - Agent
        - Market
        - Installer or updater
        - Backup or restore
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, installation method, browser, storage driver, and reverse proxy.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
