name: Release Assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Validate release tag and source commit
        id: release_meta
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          printf '%s' "$REQUESTED_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "release tag must be a stable semantic version" >&2
            exit 1
          }
          tag_commit="$(git rev-list -n 1 "$REQUESTED_TAG")"
          head_commit="$(git rev-parse HEAD)"
          [ "$tag_commit" = "$head_commit" ] || {
            echo "checked out commit does not match $REQUESTED_TAG" >&2
            exit 1
          }
          {
            echo "RELEASE_TAG=$REQUESTED_TAG"
            echo "BUILD_COMMIT=$head_commit"
          } >> "$GITHUB_ENV"
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Build release files
        run: VERSION="$RELEASE_TAG" BUILD_COMMIT="$BUILD_COMMIT" sh scripts/build-release.sh

      - name: Verify release asset set
        run: |
          set -eu
          expected='
          install-agent-linux.sh
          install-agent-windows.ps1
          install-server-linux.sh
          install-updater-linux.sh
          uninstall-agent-linux.sh
          uninstall-agent-windows.ps1
          uninstall-server-linux.sh
          vps-agent-linux-386
          vps-agent-linux-amd64
          vps-agent-linux-arm64
          vps-agent-linux-armv7
          vps-agent-windows-386.exe
          vps-agent-windows-amd64.exe
          vps-agent-windows-arm64.exe
          vps-server-linux-386
          vps-server-linux-amd64
          vps-server-linux-arm64
          vps-server-linux-armv7
          vps-server-windows-386.exe
          vps-server-windows-amd64.exe
          vps-server-windows-arm64.exe
          '
          find release -maxdepth 1 -type f -exec basename {} \; | sort > /tmp/release-assets.txt
          printf '%s\n' "$expected" | sed '/^[[:space:]]*$/d; s/^[[:space:]]*//' | sort > /tmp/expected-assets.txt
          diff -u /tmp/expected-assets.txt /tmp/release-assets.txt

      - name: Generate SHA-256 checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Sign and publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: release

      - name: Sign and verify checksum manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          [ -n "$RELEASE_SIGNING_KEY" ] || {
            echo "repository secret RELEASE_SIGNING_KEY is required" >&2
            exit 1
          }
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file" /tmp/release-signing.pub' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key_file"
          openssl pkey -in "$key_file" -check -noout
          openssl dgst -sha256 -sign "$key_file" -out release/SHA256SUMS.sig release/SHA256SUMS
          openssl pkey -in "$key_file" -pubout -out /tmp/release-signing.pub
          openssl dgst -sha256 -verify /tmp/release-signing.pub -signature release/SHA256SUMS.sig release/SHA256SUMS

      - name: Create GitHub release when needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"

      - name: Upload GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
